<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1810: Argentina</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<style>
  /* Pixel type, each crisp at one size only: Silkscreen at 8px, Jacquard 12 at 21px. */
  @font-face { font-family: 'Jacquard 12'; src: url('/fonts/Jacquard12-Regular.ttf') format('truetype'); font-display: block; }
  @font-face { font-family: 'Silkscreen'; src: url('/fonts/Silkscreen-Regular.ttf') format('truetype'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #14110f; overflow: hidden; }
  #game { width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 16px; top: 50px; color: #cdbfa3;
    font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .02em;
    text-shadow: 0 1px 0 #000; user-select: none; pointer-events: none;
  }
  #hud kbd {
    display: inline-block; min-width: 1.3em; padding: 1px 5px; margin-right: 2px; text-align: center;
    border: 1px solid #6b5c44; border-radius: 3px; background: #241d17; color: #f0e3c4;
  }
  #fx { position: fixed; left: 16px; top: 14px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100vw - 32px); }
  #fx button {
    font: 12px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .02em; cursor: pointer;
    padding: 6px 9px; border: 1px solid #6b5c44; border-radius: 4px; background: #241d17; color: #a89a80;
  }
  #fx button b { color: #6b5c44; font-weight: normal; margin-right: 5px; }
  #fx button.on { background: #cdbfa3; color: #1a1512; border-color: #f0e3c4; }
  #pause {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(12, 10, 8, .62); color: #f0e3c4; user-select: none;
    font: 63px/1 'Jacquard 12', Georgia, serif; letter-spacing: .04em;
    text-shadow: 0 3px 0 #14110f;
  }
  #pause[hidden] { display: none; }
  #pause small { font-size: 21px; letter-spacing: .02em; color: #a89a80; text-shadow: 0 1px 0 #14110f; }
  /* The game's own controls stay out of the way until it starts. */
  body:not(.playing) #fx, body:not(.playing) #hud { display: none; }
  #start {
    position: fixed; left: 0; right: 0; bottom: 7vh; text-align: center; display: none;
    font: 21px/1 'Jacquard 12', Georgia, serif; letter-spacing: .06em;
    color: #f0e3c4; text-shadow: 0 2px 0 #14110f, 0 0 12px rgba(0, 0, 0, .9);
    user-select: none; pointer-events: none; animation: blink 1.6s steps(1) infinite;
  }
  /* Twice the size where there is room: it is only crisp at multiples of 21px. */
  @media (min-width: 900px) { #start { font-size: 42px; } }
  body.title #start { display: block; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Talking to someone: the world behind stops and darkens, the two of them
     stand in large to either side, and what is said goes in the box below. */
  #dialog {
    position: fixed; inset: 0; z-index: 30; background: rgba(8, 7, 10, .68); user-select: none;
    display: flex; flex-direction: column; align-items: center; box-sizing: border-box; padding: 3vh 0 4vh;
  }
  #dialog[hidden] { display: none; }
  /* The two of them stand on the box, in whatever room it leaves: the more there is to
     read, the smaller they are, and they are never hidden behind it. */
  #dialog .faces {
    flex: 1; min-height: 0; width: min(1040px, 90vw); display: flex; justify-content: space-between; align-items: flex-end;
    box-sizing: border-box; padding: 0 2vw;
  }
  #dialog img { height: 100%; max-height: 56vh; max-width: 46%; object-fit: contain; object-position: bottom; image-rendering: pixelated; transition: filter .2s, transform .2s; transform-origin: bottom; }
  #dialog img[hidden] { visibility: hidden; display: block; }
  #dialog-hero.framed { box-shadow: 0 0 0 3px var(--hero), 0 0 0 6px #0a0807; }
  /* Whoever is not speaking falls back into shadow. */
  #dialog[data-speaker=npc] #dialog-hero, #dialog[data-speaker=hero] #dialog-npc { filter: brightness(.45) saturate(.5); transform: scale(.96); }
  #dialog .box {
    position: relative; flex: none; width: min(1040px, 90vw); min-height: 18vh;
    box-sizing: border-box; padding: 26px 28px 16px; background: #16120f; color: #f0e3c4;
    box-shadow: 0 0 0 3px var(--npc), 0 0 0 6px #0a0807; font: 21px/1.25 'Jacquard 12', Georgia, serif;
  }
  #dialog-name {
    position: absolute; right: 22px; top: -20px; padding: 5px 16px 6px; background: #2a2018; color: var(--npc);
    box-shadow: 0 0 0 3px var(--npc), 0 0 0 6px #0a0807; letter-spacing: .04em;
  }
  /* The plate sits on the side of whoever is speaking. */
  #dialog[data-speaker=hero] #dialog-name { color: var(--hero); box-shadow: 0 0 0 3px var(--hero), 0 0 0 6px #0a0807; right: auto; left: 22px; }
  #dialog-text { min-height: 2.5em; }
  #dialog-note { min-height: 1.3em; margin-top: 6px; color: #8fd18a; }
  #dialog form { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding-top: 10px; border-top: 2px solid #3a3027; }
  #dialog form span { color: var(--hero); }
  #dialog input {
    flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: #f0e3c4; caret-color: var(--hero);
    font: inherit; user-select: text;
  }
  #dialog input::placeholder { color: #6b5c44; }
  #dialog small { font-size: 21px; color: #6b5c44; white-space: nowrap; }
  /* Where nothing is written, what can be said is chosen: one line each, with its number. */
  #dialog-options { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; padding-top: 10px; border-top: 2px solid #3a3027; }
  #dialog-options:empty, #dialog-options[hidden], #dialog form[hidden] { display: none; }
  #dialog-options button {
    all: unset; cursor: pointer; padding: 2px 8px; color: #cdbf9d; font: inherit; user-select: none;
  }
  #dialog-options button::before { content: attr(data-n) ' \203A  '; color: var(--hero); }
  #dialog-options button:hover, #dialog-options button:focus-visible { background: #2a2018; color: #f0e3c4; }
  /* Twice the size where there is room: the letter is only crisp at multiples of 21px. */
  @media (min-width: 1300px) and (min-height: 1000px) { #dialog .box { font-size: 42px; padding-top: 34px; } #dialog-name { top: -34px; } }
  /* Where there is little room: less air round the words, no reminder of the keys, and on a narrow screen only whoever is spoken to. */
  @media (max-height: 560px), (max-width: 700px) {
    #dialog { padding: 1vh 0 2vh; }
    #dialog .box { padding: 20px 14px 8px; min-height: 0; width: 96vw; line-height: 1.1; }
    #dialog .faces { width: 96vw; }
    #dialog-text { min-height: 1.2em; }
    #dialog-note { min-height: 0; margin-top: 2px; }
    #dialog-options, #dialog form { margin-top: 4px; padding-top: 4px; }
    #dialog small { display: none; }
  }
  @media (max-width: 700px) { #dialog-hero { display: none; } #dialog .faces { justify-content: flex-end; } #dialog img { max-width: 70%; } }
</style>
</head>
<body>
<div id="game"></div>
<div id="fx"></div>
<div id="start">Presioná cualquier tecla</div>
<div id="dialog" hidden>
  <div class="faces"><img id="dialog-hero" alt=""><img id="dialog-npc" alt=""></div>
  <div class="box">
    <div id="dialog-name"></div>
    <div id="dialog-text"></div>
    <div id="dialog-note"></div>
    <form id="dialog-form"><span>&rsaquo;</span><input id="dialog-input" autocomplete="off" spellcheck="false" maxlength="220" placeholder="Escribí lo que le decís…"><small>Enter · Esc para irte</small></form>
    <div id="dialog-options"></div>
  </div>
</div>
<div id="pause" hidden>Pausa<small>Esc para seguir</small></div>
<div id="hud"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> o clic derecho mover · <kbd>Clic</kbd> o <kbd>Espacio</kbd> atacar · <kbd>Shift</kbd> dash · <kbd>Q</kbd> <kbd>E</kbd> habilidades · <kbd>Esc</kbd> pausa · <kbd>1</kbd>–<kbd>5</kbd> efectos · <kbd>0</kbd> ninguno · <kbd>P</kbd> colisiones · <span id="state"></span></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
